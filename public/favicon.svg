<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Border & Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Background Dark Slate Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#151726" />
      <stop offset="100%" stop-color="#0a0b10" />
    </radialGradient>

    <!-- Subtle Glow Filter for small & large icon clarity -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Border -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="none" stroke="url(#neonGrad)" stroke-width="24" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Sharp Neon Border -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="none" stroke="url(#neonGrad)" stroke-width="22" stroke-linejoin="round" />

  <!-- Cyber Status Dot Indicator (Top Right) -->
  <circle cx="410" cy="102" r="14" fill="#10b981" />
  <circle cx="410" cy="102" r="8" fill="#34d399" />

  <!-- Glowing YK Monogram (High contrast, crisp rendering at 16x16 / 32x32) -->
  <g filter="url(#neonGlow)">
    <text
      x="256"
      y="278"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="system-ui, -apple-system, 'Rajdhani', 'Segoe UI', 'Inter', Roboto, sans-serif"
      font-weight="900"
      font-size="228"
      letter-spacing="-8"
      fill="url(#textGrad)"
    >YK</text>
  </g>
</svg>
